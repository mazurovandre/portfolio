# Reverse proxy for the portfolio site.
#
# Installed on the server as /etc/nginx/sites-available/portfolio.conf and
# symlinked into sites-enabled. Kept in the repo so the deployed config is
# reviewable, but it is NOT applied by scripts/server-deploy.sh — nginx lives on
# the host, outside the compose stack, because it also owns the certificates
# that the Xray Hysteria2 inbound reads.
#
# Ports: 80 and 443/tcp here; 443/udp belongs to Hysteria2 (3x-ui).

upstream portfolio_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- Shared proxy behaviour -------------------------------------------------
# Nuxt's Nitro server. apps/api/src/app.ts runs with trustProxy: true, so the
# X-Forwarded-* headers below are what the rate limiter sees as the client IP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- ACME + plain HTTP ------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mazurovandre.online www.mazurovandre.online
                mazurovandre.ru     www.mazurovandre.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://mazurovandre.online$request_uri;
    }
}

# --- Unknown Host on 443: say nothing --------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /root/cert/mazurovandre.online/fullchain.pem;
    ssl_certificate_key /root/cert/mazurovandre.online/privkey.pem;

    return 444;
}

# --- The site ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mazurovandre.online;

    ssl_certificate     /root/cert/mazurovandre.online/fullchain.pem;
    ssl_certificate_key /root/cert/mazurovandre.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/xml application/json application/javascript
                     application/xml+rss image/svg+xml;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# --- www.mazurovandre.online -> apex ---------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mazurovandre.online;

    ssl_certificate     /root/cert/mazurovandre.online/fullchain.pem;
    ssl_certificate_key /root/cert/mazurovandre.online/privkey.pem;

    return 301 https://mazurovandre.online$request_uri;
}

# --- mazurovandre.ru -> mazurovandre.online --------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mazurovandre.ru www.mazurovandre.ru;

    ssl_certificate     /root/cert/mazurovandre.ru/fullchain.pem;
    ssl_certificate_key /root/cert/mazurovandre.ru/privkey.pem;

    return 301 https://mazurovandre.online$request_uri;
}

# --- Hysteria2 masquerade backend ------------------------------------------
# The 443/udp Hysteria2 inbound proxies anything that is not a valid Hysteria2
# handshake to this listener, so an HTTP/3 probe of the QUIC port gets the very
# same page as a normal browser. Loopback only.
server {
    listen 127.0.0.1:8080;
    server_name _;

    location / {
        proxy_pass         http://portfolio_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              mazurovandre.online;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }
}
